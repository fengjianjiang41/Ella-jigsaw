<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jigsaw Puzzle Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="controls">
        <button id="startBtn">Start</button>
        <span id="timer">00:00.00</span>
        <button id="confirmBtn" disabled>Confirm</button>
    </div>
    <div class="jigsaw-container">
        <canvas class="jigsaw" id="jigsaw1" width="2688" height="1536"></canvas>
        <canvas class="jigsaw" id="jigsaw2" width="2688" height="1536"></canvas>
        <canvas class="jigsaw" id="jigsaw3" width="2688" height="1536"></canvas>
    </div>
    <script src="script.js"></script>
</body>
</html>
